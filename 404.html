<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sinal perdido — Lucas Michel Pereira</title>
<meta name="theme-color" content="#06050b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2306050b'/%3E%3Crect x='3' y='3' width='3' height='10' fill='%23ff2bd6'/%3E%3Crect x='3' y='10' width='6' height='3' fill='%23ff2bd6'/%3E%3Crect x='10' y='3' width='3' height='3' fill='%234fd8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@900&display=swap">
<!-- página que o GitHub Pages mostra para qualquer endereço que não existe;
     tudo inline, porque ela pode ser servida em qualquer caminho -->
<style>
  :root { --bg: #06050b; --ink: #ece8ff; --dim: #8a85a8; --pink: #ff2bd6; --cyan: #4fd8ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 14px/1.6 "JetBrains Mono", ui-monospace, monospace;
    display: grid; place-items: center; padding: 16px; overflow: hidden;
    background-image: radial-gradient(rgba(255, 255, 255, .06) 1px, transparent 1.4px); background-size: 14px 14px;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .35) 2px 3px);
  }
  main { text-align: center; max-width: 640px; }
  .ch { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  h1 {
    font: 900 clamp(44px, 13vw, 120px)/1 "Unbounded", "Arial Black", sans-serif; margin: 18px 0 20px;
    text-shadow: -4px 0 var(--pink), 4px 0 var(--cyan); animation: jit 2.4s steps(1) infinite;
  }
  @keyframes jit {
    0%, 88%, 100% { transform: none; text-shadow: -4px 0 var(--pink), 4px 0 var(--cyan); }
    90% { transform: translateX(-6px) skewX(8deg); text-shadow: -10px 0 var(--pink), 8px 0 var(--cyan); }
    94% { transform: translateX(5px); text-shadow: 6px 0 var(--pink), -6px 0 var(--cyan); }
  }
  p { color: var(--dim); }
  a {
    display: inline-block; margin-top: 28px; padding: 12px 20px; color: var(--ink); text-decoration: none;
    border: 1px solid var(--pink); letter-spacing: .14em; text-transform: uppercase; font-size: 12px;
  }
  a::before { content: "▸ "; color: var(--pink); }
  a:hover { background: var(--pink); color: var(--bg); }
  a:hover::before { color: var(--bg); }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="ch" data-pt="CH.?? // sem sinal" data-en="CH.?? // no signal">CH.?? // sem sinal</div>
  <h1>ERRO_404</h1>
  <p data-pt="Este canal não existe. O endereço pode ter mudado ou ter sido digitado errado." data-en="This channel doesn't exist. The address may have changed or been mistyped.">Este canal não existe. O endereço pode ter mudado ou ter sido digitado errado.</p>
  <a href="/" data-pt="voltar ao início" data-en="back to home">voltar ao início</a>
</main>
<script>
  // mesmo idioma do site: a escolha salva ou, sem ela, o do navegador
  (() => {
    let saved = null;
    try { saved = localStorage.getItem('lmp-lang'); } catch (e) { /* sem storage */ }
    const en = saved ? saved === 'en' : !/^pt/i.test(navigator.language || 'pt');
    if (!en) return;
    document.documentElement.lang = 'en';
    document.title = 'Signal lost — Lucas Michel Pereira';
    document.querySelectorAll('[data-en]').forEach((el) => { el.textContent = el.dataset.en; });
    document.querySelector('h1').textContent = 'ERROR_404';
  })();
</script>
</body>
</html>
